<style>
/* Typsnitten ligger lokalt (latin-delmängd, OFL) så att appen fungerar offline. */
@font-face { font-family: "Bricolage Grotesque"; font-weight: 500 700; font-display: swap; src: url(fonts/bricolage-grotesque-latin.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 400; font-display: swap; src: url(fonts/ibm-plex-mono-400-latin.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-weight: 500; font-display: swap; src: url(fonts/ibm-plex-mono-500-latin.woff2) format("woff2"); }
/* Layout: ett skärmsspel i en kolumn. Rubrikrad, bräde i fyrkant, statusrad, verktygsfält. Banväljaren fäller ut över brädet. */
:root {
  color-scheme: dark;
  --bg: #121414;
  --panel: #1b1e1e;
  --panel-2: #252929;
  --fg: #e9ebe6;
  --muted: #8f9792;
  --line: #c8ccc4;
  --ink: #0b0d0d;
  --gold: #e3b341;
  --bad: #ef5b50;
  --good: #7fc28a;
  --r0: #a5472f; --r1: #9a6e1c; --r2: #6f8128; --r3: #2f7d57; --r4: #237d82;
  --r5: #2f6ea3; --r6: #6a53a8; --r7: #92489a; --r8: #a43f68;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
/* Ingen dra-för-att-uppdatera eller studs: ett svep nedåt på brädet ska inte ladda om sidan. */
html, body { height: 100%; margin: 0; overscroll-behavior: none; }
body {
  box-sizing: border-box; background: var(--bg); color: var(--fg);
  font: 15px/1.4 var(--display);
  /* Säkra marginaler för notch och hemindikator när appen körs i helskärm. */
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display: flex; flex-direction: column; align-items: center;
  overflow-x: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.app { width: min(100%, 560px); flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
h1 small { display: block; font: 400 12px var(--mono); color: var(--muted); letter-spacing: 0.04em; margin-top: 3px; text-transform: uppercase; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.pill { background: var(--panel-2); border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 500; }
.pill:hover { background: #2f3434; }
.timer { font: 500 22px var(--mono); font-variant-numeric: tabular-nums; }

.stage { position: relative; width: 100%; }
.board { position: relative; width: max-content; margin-inline: 0; line-height: 0; border-radius: 6px; overflow: hidden; touch-action: none; }
.board canvas { display: block; image-rendering: pixelated; }
.cells { position: absolute; inset: 0; display: grid; padding: var(--lp, 4px); gap: 0; }
.cell {
  position: relative; border: 0; padding: 0; margin: 0; display: grid; place-items: center; background: transparent;
  color: rgba(255,255,255,.6); font: 500 clamp(14px, 5vw, 26px) var(--mono); -webkit-tap-highlight-color: transparent;
}
.cell svg { width: 58.9%; height: 58.9%; fill: #f6f3ea; filter: drop-shadow(0 1px 1px rgba(0,0,0,.45)); }
.cell.conflict svg { fill: #1a0c0c; filter: none; }
.cell.conflict::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px #fff; background: repeating-linear-gradient(45deg, rgba(0,0,0,.28) 0 5px, transparent 5px 10px); }
.cell.why::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,.36) 0 3px, transparent 3px 7px); }
.cell svg { position: relative; z-index: 1; }
.cell.hint::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px #fff; animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { opacity: .25; } }
.board.done .cell svg { fill: var(--gold); filter: drop-shadow(0 1px 1px rgba(0,0,0,.55)); }
.board.done { pointer-events: none; }

.status { min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.count { font: 400 13px var(--mono); color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.count b { color: var(--fg); font-weight: 500; }
.msg.bad { color: var(--bad); }
.msg { color: var(--muted); font-size: 14px; line-height: 1.3; min-width: 0; text-align: right; }
.explain { background: var(--panel); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.45; }
.explain b { display: block; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.win { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; }
.win strong { font-size: 18px; color: var(--good); }
.win .go { background: var(--gold); color: #1b1a14; border: 0; border-radius: 999px; padding: 11px 20px; font-weight: 700; }

.bar { display: flex; gap: 8px; margin-top: auto; padding-bottom: 6px; }
.bar button { flex: 1; background: var(--panel); border: 1px solid #2c3131; border-radius: 12px; padding: 13px 6px; font-size: 14px; }
.bar button:hover:not(:disabled) { background: var(--panel-2); }
.bar button:disabled { opacity: .35; cursor: default; }

.picker { position: absolute; inset: 0; background: var(--panel); border-radius: 4px; padding: 14px; overflow-y: auto; z-index: 5; }
.picker h2 { margin: 0 0 8px; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.picker section + section { margin-top: 16px; }
.lv { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.lv button { background: var(--panel-2); border: 1px solid transparent; border-radius: 8px; padding: 8px 0; font: 400 13px var(--mono); font-variant-numeric: tabular-nums; }
.lv button.solved { color: var(--good); border-color: #2f4a36; }
.lv button.now { background: var(--gold); color: #1b1a14; font-weight: 500; }
@media (prefers-reduced-motion: reduce) { .cell.hint::after { animation: none; } }
/* Startskärm: logon (samma som ikonen) byggs upp, sedan Spela, Välj bana och Regler. Ligger först i body så den täcker innan skriptet körts. */
.start { position: fixed; inset: 0; z-index: 15; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; overflow-y: auto; transition: opacity .25s ease;
  padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); }
.start.out { opacity: 0; pointer-events: none; }
.start[hidden] { display: none; }
.start svg { width: min(46vw, 200px); height: auto; overflow: visible; flex: 0 0 auto; }
.start .menu { width: min(100%, 300px); display: flex; flex-direction: column; gap: 10px; margin-top: 10px; animation: rise .4s .75s both; }
.start .menu button { border: 1px solid #2c3131; background: var(--panel); border-radius: 999px; padding: 13px 20px; font-size: 16px; font-weight: 500; }
.start .menu button:hover { background: var(--panel-2); }
.start .menu .play { background: var(--gold); border-color: var(--gold); color: #1b1a14; font-weight: 700; font-size: 18px; padding: 15px 20px; }
.start .menu .play:hover { background: #ecc25a; }
.start .menu .play small { display: block; font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: .7; margin-top: 2px; }
.start .progress { font: 400 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; animation: rise .4s .7s both; }
.start .sq { transform-box: fill-box; transform-origin: center; animation: sq .42s cubic-bezier(.2,.9,.3,1.3) both; }
.start .sq:nth-of-type(2) { animation-delay: .07s; } .start .sq:nth-of-type(3) { animation-delay: .14s; } .start .sq:nth-of-type(4) { animation-delay: .21s; }
.start .frame { animation: fade .3s .3s both; }
.start .crown { transform-box: fill-box; transform-origin: center bottom; animation: crown .5s .42s cubic-bezier(.3,1.5,.5,1) both; }
.start .word { text-align: center; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; animation: rise .4s .6s both; }
.start .word, .start .progress { margin: 0; }
@keyframes sq { from { transform: scale(0); } }
@keyframes crown { from { transform: translateY(-40%) scale(.6); opacity: 0; } }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* Regler: helskärmsark med små ritade exempelbräden. */
.icon-btn { width: 40px; padding: 9px 0; text-align: center; font-weight: 700; }
.actions { display: flex; gap: 6px; }
.rules { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.rules-in { width: min(100%, 560px); margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.rules-in > header { position: sticky; top: calc(-1 * max(12px, env(safe-area-inset-top))); background: var(--bg); padding: 4px 0 8px; z-index: 1; }
.rules h2 { margin: 0; font-size: 22px; font-weight: 700; line-height: 1.1; }
.rules h2 small { display: block; font: 400 12px var(--mono); color: var(--muted); letter-spacing: .04em; margin-top: 3px; text-transform: uppercase; }
.rules-body { display: flex; flex-direction: column; gap: 12px; }
.rule { display: flex; gap: 14px; align-items: center; background: var(--panel); border-radius: 12px; padding: 12px; }
.rule .pic { flex: 0 0 auto; width: 118px; }
.rule .pic.wide { width: 100%; }
.rule h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.rule p { margin: 0; color: #c4c9c2; font-size: 14px; line-height: 1.45; }
.rule h3 .n { font: 500 12px var(--mono); color: var(--gold); margin-right: 6px; }
.rule.col { flex-direction: column; align-items: stretch; }
.mini { display: block; width: 100%; height: auto; border-radius: 4px; }
.taps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; font: 400 12px var(--mono); color: var(--muted); letter-spacing: .03em; }
.taps .mini { width: 56px; margin: 0 auto 6px; }
.verdict { display: inline-block; margin-top: 6px; font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.verdict.bad { color: var(--bad); } .verdict.good { color: var(--good); }
.rules .go { background: var(--gold); color: #1b1a14; border: 0; border-radius: 999px; padding: 13px 20px; font-weight: 700; margin: 6px 0 4px; }
@media (prefers-reduced-motion: reduce) { .start *, .start { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="start" id="start" role="dialog" aria-label="Queens startskärm">
  <svg viewBox="108 108 296 296" aria-hidden="true">
    <g transform="translate(116 116)">
      <rect class="sq" width="140" height="140" fill="#a5472f"/>
      <rect class="sq" x="140" width="140" height="140" fill="#2f6ea3"/>
      <rect class="sq" x="140" y="140" width="140" height="140" fill="#6a53a8"/>
      <rect class="sq" y="140" width="140" height="140" fill="#2f7d57"/>
      <g class="frame">
        <path d="M0 140h280M140 0v280" stroke="#0b0d0d" stroke-width="6"/>
        <rect width="280" height="280" fill="none" stroke="#c8ccc4" stroke-width="8"/>
      </g>
    </g>
    <g transform="translate(256 256) scale(7.5) translate(-12 -13.5)">
      <path class="crown" d="M3 8l4.5 4 4.5-7 4.5 7L21 8l-2 10H5L3 8zm2 12h14v2H5z" fill="#e3b341" stroke="#0b0d0d" stroke-width="1" stroke-linejoin="round" paint-order="stroke"/>
    </g>
  </svg>
  <h1 class="word">Queens</h1>
  <p class="progress" id="progress"></p>
  <div class="menu">
    <button class="play" id="startPlay" type="button">Spela<small id="startLevel"></small></button>
    <button id="startPick" type="button">Välj bana</button>
    <button id="startRules" type="button">Regler</button>
  </div>
</div>

<!-- Mönster för exempelbrädena i Regler. Får inte vara display:none, då ritas inte mönstren. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="p-bad" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3.5" height="7" fill="rgba(0,0,0,.28)"/></pattern>
    <pattern id="p-why" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="2.1" fill="rgba(0,0,0,.36)"/></pattern>
  </defs>
</svg>

<div class="app">
  <header>
    <h1 id="title">Bana 1<small id="sub">6 x 6</small></h1>
    <div class="timer" id="timer">00:00</div>
    <div class="actions">
      <button class="pill icon-btn" id="rulesBtn" type="button" aria-label="Regler" title="Regler">?</button>
      <button class="pill" id="menuBtn" type="button" aria-expanded="false">Banor</button>
    </div>
  </header>
  <div class="stage" id="stage">
    <div class="board" id="board" role="grid" aria-label="Spelbräde"></div>
    <div class="picker" id="picker" hidden></div>
  </div>
  <div class="status" id="status"></div>
  <div class="explain" id="explain" hidden></div>
  <div class="bar">
    <button id="undo" type="button">Ångra</button>
    <button id="redo" type="button">Gör om</button>
    <button id="hint" type="button">Tips</button>
    <button id="reset" type="button">Börja om</button>
  </div>
</div>

<div class="rules" id="rules" role="dialog" aria-modal="true" aria-labelledby="rulesTitle" hidden>
  <div class="rules-in">
    <header><h2 id="rulesTitle">Regler<small>Så spelar du Queens</small></h2><button class="pill" id="rulesClose" type="button">Stäng</button></header>
    <div class="rules-body" id="rulesBody"></div>
    <button class="go" id="rulesPlay" type="button">Spela</button>
  </div>
</div>

<script>
const LEVELS = __LEVELS__;
const CROWN_D = 'M3 8l4.5 4 4.5-7 4.5 7L21 8l-2 10H5L3 8zm2 12h14v2H5z';
const CROWN = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${CROWN_D}"/></svg>`;
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let solvedMap = store.get('queens.solved', {});
let idx = Math.min(Math.max(store.get('queens.cur', 0), 0), LEVELS.length - 1);
let lv, n, marks, undoSt, redoSt, secs, finished, timerId = null;
let hint = { cells: new Set(), why: new Set(), kind: '', text: '' };
function clearHint() { hint = { cells: new Set(), why: new Set(), kind: '', text: '' }; }

const fmt = (s) => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

function conflicts() {
  const bad = new Set(); const q = [];
  marks.forEach((m, i) => { if (m === 2) q.push(i); });
  for (let a = 0; a < q.length; a++) for (let b = a + 1; b < q.length; b++) {
    const i = q[a], j = q[b], ri = (i / n) | 0, rj = (j / n) | 0, ci = i % n, cj = j % n;
    if (ri === rj || ci === cj || lv.grid[i] === lv.grid[j] || (Math.abs(ri - rj) <= 1 && Math.abs(ci - cj) <= 1)) { bad.add(i); bad.add(j); }
  }
  return bad;
}

// Brädet ritas på en canvas i hela skärmpixlar, så alla linjer blir exakt lika tjocka oavsett skärmtäthet.
let geo = null;
function fit() {
  const dpr = window.devicePixelRatio || 1;
  const thinD = Math.max(1, Math.round(dpr));        // linje inne i ett område
  const thickD = Math.max(3, Math.round(3.5 * dpr));  // gräns mellan två områden
  const frameD = Math.max(4, Math.round(4.5 * dpr));  // ram runt hela brädet
  const availD = Math.floor(Math.min($('stage').clientWidth, 560) * dpr);
  const cellD = Math.max(16, Math.floor((availD - 2 * frameD) / n));
  const size = n * cellD + 2 * frameD;
  const cv = $('cv'), css = (d) => Math.ceil((d / dpr) * 64) / 64;
  cv.width = size; cv.height = size;
  cv.style.width = css(size) + 'px'; cv.style.height = css(size) + 'px';
  const bd = $('board');
  bd.style.setProperty('--lp', css(frameD) + 'px');
  // Lägg brädet exakt på en hel skärmpixel, annars skalar webbläsaren om canvasen och linjerna blir olika tjocka.
  bd.style.top = '0px';
  const topD = cv.getBoundingClientRect().top * dpr;
  bd.style.top = Math.ceil(((Math.round(topD) - topD) / dpr) * 64) / 64 + 'px';

  const ctx = cv.getContext('2d'), cs = getComputedStyle(document.documentElement);
  const ink = cs.getPropertyValue('--ink').trim() || '#0b0d0d';
  ctx.fillStyle = cs.getPropertyValue('--line').trim() || '#c8ccc4'; ctx.fillRect(0, 0, size, size);
  const at = (k) => frameD + k * cellD;
  for (let i = 0; i < n * n; i++) {
    ctx.fillStyle = cs.getPropertyValue('--r' + lv.grid[i]).trim();
    ctx.fillRect(at(i % n), at((i / n) | 0), cellD, cellD);
  }
  const g = lv.grid, wOf = (a, c) => (g[a] !== g[c] ? thickD : thinD);
  ctx.fillStyle = ink;
  for (let r = 0; r < n; r++) for (let c = 1; c < n; c++) {          // lodräta linjer
    const w = wOf(r * n + c - 1, r * n + c);
    ctx.fillRect(at(c) - (w >> 1), at(r), w, cellD);
  }
  for (let r = 1; r < n; r++) for (let c = 0; c < n; c++) {          // vågräta linjer
    const w = wOf((r - 1) * n + c, r * n + c);
    ctx.fillRect(at(c), at(r) - (w >> 1), cellD, w);
  }
  for (let r = 1; r < n; r++) for (let c = 1; c < n; c++) {          // hörn där linjer möts
    const m = Math.max(
      wOf((r - 1) * n + c - 1, r * n + c - 1), wOf((r - 1) * n + c, r * n + c),
      wOf((r - 1) * n + c - 1, (r - 1) * n + c), wOf(r * n + c - 1, r * n + c));
    ctx.fillRect(at(c) - (m >> 1), at(r) - (m >> 1), m, m);
  }
}
window.addEventListener('resize', () => { if (lv) fit(); });
// iOS Safari respekterar inte alltid overscroll-behavior. Touchrörelser som börjar på brädet får därför aldrig
// scrolla eller ladda om sidan. Bara touchmove stoppas, så vanliga tryck (click) fungerar som förut.
$('board').addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });

function build() {
  const b = $('board');
  b.innerHTML = '<canvas id="cv"></canvas><div class="cells" id="cells"></div>';
  const cells = $('cells');
  cells.style.gridTemplateColumns = `repeat(${n}, 1fr)`;
  cells.style.gridTemplateRows = `repeat(${n}, 1fr)`;
  for (let i = 0; i < n * n; i++) {
    const el = document.createElement('button');
    el.type = 'button'; el.className = 'cell'; el.dataset.i = i; el.setAttribute('role', 'gridcell');
    cells.appendChild(el);
  }
  fit();
}

function paint() {
  const bad = conflicts();
  const cells = $('cells').children;
  for (let i = 0; i < cells.length; i++) {
    const el = cells[i], m = marks[i];
    el.innerHTML = m === 2 ? CROWN : (m === 1 ? '&times;' : '');
    el.classList.toggle('conflict', bad.has(i));
    el.classList.toggle('hint', hint.cells.has(i));
    el.classList.toggle('why', hint.why.has(i));
    el.setAttribute('aria-label', `Rad ${((i / n) | 0) + 1}, kolumn ${(i % n) + 1}, ${['tom', 'kryss', 'dam'][m]}`);
  }
  const ex = $('explain');
  ex.hidden = !hint.text;
  ex.innerHTML = hint.text ? '<b>Varför</b>' : '';
  if (hint.text) ex.appendChild(document.createTextNode(hint.text));
  const placed = marks.filter((m) => m === 2).length;
  finished = placed === n && bad.size === 0;
  $('board').classList.toggle('done', finished);
  const st = $('status');
  if (finished) {
    const best = solvedMap[lv.id];
    if (best == null || secs < best) { solvedMap[lv.id] = secs; store.set('queens.solved', solvedMap); }
    const last = idx === LEVELS.length - 1;
    store.set('queens.cur', last ? idx : idx + 1); // nästa gång appen öppnas ligger man på nästa bana
    st.innerHTML = `<div class="win"><strong>Klarad på ${fmt(secs)}</strong>${last ? '' : '<button class="go" id="next" type="button">Nästa bana</button>'}</div>`;
    const nx = $('next'); if (nx) nx.onclick = () => load(idx + 1);
  } else {
    st.innerHTML = `<span class="count">Damer <b>${placed}</b> av ${n}</span><span class="msg${bad.size ? ' bad' : ''}" id="msg">${bad.size ? 'Två damer krockar.' : 'Tryck: kryss, dam, tom.'}</span>`;
  }
  $('undo').disabled = !undoSt.length; $('redo').disabled = !redoSt.length;
  $('hint').disabled = finished;
}

function load(i) {
  idx = i; lv = LEVELS[i]; n = lv.n;
  marks = new Array(n * n).fill(0); undoSt = []; redoSt = []; secs = 0; clearHint();
  store.set('queens.cur', i);
  $('title').firstChild.nodeValue = 'Bana ' + lv.id;
  $('sub').textContent = `${n} x ${n}` + (solvedMap[lv.id] != null ? ` · bäst ${fmt(solvedMap[lv.id])}` : '');
  $('timer').textContent = fmt(0);
  build(); paint(); closePicker();
}

function setMarks(next) {
  undoSt.push(marks.slice()); redoSt = []; marks = next; clearHint(); paint();
}

// Dra över brädet för att kryssa alla rutor fingret passerar, åt vilket håll som helst. Damer lämnas orörda.
// Börjar dragningen på ett kryss suddas kryss i stället. Hela dragningen blir ett steg i Ångra.
// Rör sig fingret inte från startrutan räknas det som ett vanligt tryck (click nedan).
let drag = null, skipClick = false;
function cellAt(x, y) {
  const r = $('cells').getBoundingClientRect(), pad = parseFloat(getComputedStyle($('cells')).paddingLeft) || 0;
  const size = (r.width - 2 * pad) / n, c = Math.floor((x - r.left - pad) / size), row = Math.floor((y - r.top - pad) / size);
  return c >= 0 && c < n && row >= 0 && row < n ? row * n + c : -1;
}
function dragMark(i) {
  if (i < 0) return;
  if (drag.erase ? marks[i] === 1 : marks[i] === 0) { marks[i] = drag.erase ? 0 : 1; drag.changed = true; }
}
$('board').addEventListener('pointerdown', (e) => {
  if (finished || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const i = cellAt(e.clientX, e.clientY); if (i < 0) return;
  drag = { id: e.pointerId, start: i, x: e.clientX, y: e.clientY, active: false, erase: marks[i] === 1, base: marks.slice(), changed: false };
});
$('board').addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const to = cellAt(e.clientX, e.clientY);
  if (!drag.active) {
    if (to === drag.start || to < 0) return;
    drag.active = true; clearHint();
    $('board').setPointerCapture(e.pointerId);
    dragMark(drag.start);
  }
  // Följ fingrets väg i små steg, så att ett snabbt svep inte hoppar över rutor.
  const cellPx = $('cells').getBoundingClientRect().width / n, dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / (cellPx / 4)));
  for (let k = 1; k <= steps; k++) dragMark(cellAt(drag.x + (dx * k) / steps, drag.y + (dy * k) / steps));
  drag.x = e.clientX; drag.y = e.clientY;
  paint();
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (drag.active) {
    skipClick = true; setTimeout(() => { skipClick = false; }, 0);
    if (drag.changed) { undoSt.push(drag.base); redoSt = []; paint(); }
  }
  drag = null;
}
$('board').addEventListener('pointerup', endDrag);
$('board').addEventListener('pointercancel', endDrag);

$('board').addEventListener('click', (e) => {
  if (skipClick) { skipClick = false; return; }
  const el = e.target.closest('.cell'); if (!el || finished) return;
  const i = +el.dataset.i, next = marks.slice();
  next[i] = (next[i] + 1) % 3;
  setMarks(next);
});
$('undo').onclick = () => { if (!undoSt.length) return; redoSt.push(marks.slice()); marks = undoSt.pop(); clearHint(); paint(); };
$('redo').onclick = () => { if (!redoSt.length) return; undoSt.push(marks.slice()); marks = redoSt.pop(); clearHint(); paint(); };
$('reset').onclick = () => { if (marks.some((m) => m)) setMarks(new Array(n * n).fill(0)); secs = 0; $('timer').textContent = fmt(0); };
const NAMES = ['tegelröda', 'ockra', 'olivgröna', 'gröna', 'turkosa', 'blå', 'lila', 'rosalila', 'hallonröda'];
const listText = (a) => (a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' och ' + a[a.length - 1]);
const regPhrase = (gs) => (gs.length === 1 ? `Det ${NAMES[gs[0]]} området` : `De ${listText(gs.map((g) => NAMES[g]))} områdena`);
const combos = (arr, k) => { const out = []; (function rec(st, cur) { if (cur.length === k) { out.push(cur.slice()); return; } for (let i = st; i < arr.length; i++) { cur.push(arr[i]); rec(i + 1, cur); cur.pop(); } })(0, []); return out; };
const pc = (x) => { let c = 0; while (x) { x &= x - 1; c++; } return c; };

// Hittar nästa logiska steg från de damer som ligger på brädet: antingen en dam som måste stå på en viss ruta,
// eller rutor som kan strykas. Returnerar också vilka rutor som är skälet (why).
function computeHint() {
  const grid = lv.grid, N = n * n, R = (i) => (i / n) | 0, C = (i) => i % n;
  const st = { cand: new Uint8Array(N).fill(1), rowP: new Uint8Array(n), colP: new Uint8Array(n), regP: new Uint8Array(n) };
  const place = (S, i) => {
    const r = R(i), c = C(i), g = grid[i];
    for (let j = 0; j < N; j++) if (R(j) === r || C(j) === c || grid[j] === g || (Math.abs(R(j) - r) <= 1 && Math.abs(C(j) - c) <= 1)) S.cand[j] = 0;
    S.rowP[r] = 1; S.colP[c] = 1; S.regP[g] = 1;
  };
  marks.forEach((m, i) => { if (m === 2) place(st, i); });
  const regCells = (g) => { const o = []; for (let i = 0; i < N; i++) if (grid[i] === g) o.push(i); return o; };
  const rowCells = (r) => Array.from({ length: n }, (_, c) => r * n + c);
  const colCells = (c) => Array.from({ length: n }, (_, r) => r * n + c);
  const lineName = (kind, ids) => (kind === 'r' ? (ids.length === 1 ? `Rad ${ids[0] + 1}` : `Rad ${listText(ids.map((x) => x + 1))}`) : (ids.length === 1 ? `Kolumn ${ids[0] + 1}` : `Kolumn ${listText(ids.map((x) => x + 1))}`));
  const lineLower = (kind, ids) => lineName(kind, ids).replace(/^R/, 'r').replace(/^K/, 'k');
  const dead = (S) => {
    const gc = new Array(n).fill(0), rc = new Array(n).fill(0), cc = new Array(n).fill(0);
    for (let i = 0; i < N; i++) if (S.cand[i]) { gc[grid[i]]++; rc[R(i)]++; cc[C(i)]++; }
    for (let x = 0; x < n; x++) {
      if (!S.regP[x] && gc[x] === 0) return { cells: regCells(x), text: `det ${NAMES[x]} området` };
      if (!S.rowP[x] && rc[x] === 0) return { cells: rowCells(x), text: `rad ${x + 1}` };
      if (!S.colP[x] && cc[x] === 0) return { cells: colCells(x), text: `kolumn ${x + 1}` };
    }
    return null;
  };
  function setStep(k) {
    const regs = [], rows = [], cols = [];
    for (let x = 0; x < n; x++) { if (!st.regP[x]) regs.push(x); if (!st.rowP[x]) rows.push(x); if (!st.colP[x]) cols.push(x); }
    if (regs.length <= k) return null;
    const rm = new Array(n).fill(0), cm = new Array(n).fill(0), rr = new Array(n).fill(0), cc = new Array(n).fill(0);
    for (let i = 0; i < N; i++) if (st.cand[i]) { const g = grid[i]; rm[g] |= 1 << R(i); cm[g] |= 1 << C(i); rr[R(i)] |= 1 << g; cc[C(i)] |= 1 << g; }
    const bits = (m) => { const o = []; for (let x = 0; x < n; x++) if ((m >> x) & 1) o.push(x); return o; };
    const take = (f) => { const e = []; for (let i = 0; i < N; i++) if (st.cand[i] && f(i)) e.push(i); return e; };
    for (const S of combos(regs, k)) {
      let rU = 0, cU = 0, sm = 0; for (const g of S) { rU |= rm[g]; cU |= cm[g]; sm |= 1 << g; }
      const inS = (i) => (sm >> grid[i]) & 1;
      if (pc(rU) === k) { const e = take((i) => ((rU >> R(i)) & 1) && !inS(i)); if (e.length) { const ids = bits(rU); return { elim: e, why: S.flatMap(regCells), text: k === 1 ? `${regPhrase(S)} ligger bara i ${lineLower('r', ids)}. Dess dam måste stå där, så resten av raden stryks.` : `${regPhrase(S)} ryms bara i ${lineLower('r', ids)}. Deras damer fyller de raderna, så andra områden stryks där.` }; } }
      if (pc(cU) === k) { const e = take((i) => ((cU >> C(i)) & 1) && !inS(i)); if (e.length) { const ids = bits(cU); return { elim: e, why: S.flatMap(regCells), text: k === 1 ? `${regPhrase(S)} ligger bara i ${lineLower('c', ids)}. Dess dam måste stå där, så resten av kolumnen stryks.` : `${regPhrase(S)} ryms bara i ${lineLower('c', ids)}. Deras damer fyller de kolumnerna, så andra områden stryks där.` }; } }
    }
    for (const kind of ['r', 'c']) {
      const lines = kind === 'r' ? rows : cols, map = kind === 'r' ? rr : cc;
      for (const L of combos(lines, k)) {
        let gU = 0, lm = 0; for (const x of L) { gU |= map[x]; lm |= 1 << x; }
        if (pc(gU) !== k) continue;
        const e = take((i) => ((gU >> grid[i]) & 1) && !((lm >> (kind === 'r' ? R(i) : C(i))) & 1));
        if (!e.length) continue;
        const gs = bits(gU);
        return { elim: e, why: L.flatMap(kind === 'r' ? rowCells : colCells), text: `${lineName(kind, L)} kan bara ha ${k === 1 ? 'sin dam' : 'damer'} i ${regPhrase(gs).toLowerCase()}, så ${k === 1 ? 'det områdets' : 'de områdenas'} övriga rutor stryks.` };
      }
    }
    return null;
  }

  for (let guard = 0; guard < 300; guard++) {
    for (let g = 0; g < n; g++) {
      if (st.regP[g]) continue;
      const c = regCells(g).filter((i) => st.cand[i]);
      if (c.length === 1) return { kind: 'place', cells: [c[0]], why: regCells(g), text: `Det ${NAMES[g]} området har bara en ruta kvar. Placera en dam i den markerade rutan.` };
    }
    for (let r = 0; r < n; r++) {
      if (st.rowP[r]) continue;
      const c = rowCells(r).filter((i) => st.cand[i]);
      if (c.length === 1) return { kind: 'place', cells: [c[0]], why: rowCells(r), text: `Rad ${r + 1} har bara en ruta kvar. Placera en dam i den markerade rutan.` };
    }
    for (let q = 0; q < n; q++) {
      if (st.colP[q]) continue;
      const c = colCells(q).filter((i) => st.cand[i]);
      if (c.length === 1) return { kind: 'place', cells: [c[0]], why: colCells(q), text: `Kolumn ${q + 1} har bara en ruta kvar. Placera en dam i den markerade rutan.` };
    }
    let progressed = false;
    for (const k of [1, 2, 3]) {
      const stp = setStep(k);
      if (!stp) continue;
      stp.elim.forEach((i) => { st.cand[i] = 0; });
      if (stp.elim.some((i) => marks[i] !== 1)) return { kind: 'elim', cells: stp.elim, why: stp.why, text: stp.text + ' Stryk de markerade rutorna.' };
      progressed = true; break;
    }
    if (progressed) continue;
    for (let i = 0; i < N; i++) {
      if (!st.cand[i]) continue;
      const S = { cand: Uint8Array.from(st.cand), rowP: st.rowP.slice(), colP: st.colP.slice(), regP: st.regP.slice() };
      place(S, i);
      const d = dead(S);
      if (!d) continue;
      st.cand[i] = 0; progressed = true;
      if (marks[i] !== 1) return { kind: 'elim', cells: [i], why: d.cells, text: `En dam i den markerade rutan skulle lämna ${d.text} utan en enda ruta. Stryk rutan.` };
      break;
    }
    if (!progressed) return null;
  }
  return null;
}

$('hint').onclick = () => {
  const sol = new Set(lv.solution.map((c, r) => r * n + c));
  let wrong = -1;
  marks.forEach((m, i) => { if (m === 2 && !sol.has(i) && wrong < 0) wrong = i; });
  clearHint();
  if (wrong >= 0) { hint = { cells: new Set([wrong]), why: new Set(), kind: 'wrong', text: 'Den markerade damen står fel. Ta bort den eller flytta den.' }; paint(); return; }
  const h = computeHint();
  if (h) { hint = { cells: new Set(h.cells), why: new Set(h.why), kind: h.kind, text: h.text }; paint(); return; }
  for (let r = 0; r < n; r++) {
    const i = r * n + lv.solution[r];
    if (marks[i] !== 2) { hint = { cells: new Set([i]), why: new Set(), kind: 'place', text: 'Här ska en dam stå. Banan går att lösa med den rutan som utgångspunkt.' }; paint(); return; }
  }
};

function openPicker() {

$('menuBtn').onclick = () => ($('picker').hidden ? openPicker() : closePicker());

// Regler. Exemplen ritas som små SVG-bräden med samma färger och markeringar som spelet, i stället för skärmbilder.
// o: { n, grid, q: damer, x: kryss, bad: krockar, why: skälet (ränder), hint: ruta att agera på, done: guldkronor }
function mini(o) {
  const n = o.n, s = 24, f = 2, W = n * s + 2 * f, at = (k) => f + k * s, has = (a, i) => (a || []).includes(i);
  const g = o.grid, wOf = (a, b) => (g[a] !== g[b] ? 2 : 0.75);
  let h = `<svg class="mini" viewBox="0 0 ${W} ${W}" role="img" aria-label="${o.label || ''}"><rect width="${W}" height="${W}" style="fill:var(--line)"/>`;
  for (let i = 0; i < n * n; i++) h += `<rect x="${at(i % n)}" y="${at((i / n) | 0)}" width="${s}" height="${s}" style="fill:var(--r${g[i]})"/>`;
  let ln = '';
  for (let r = 0; r < n; r++) for (let c = 1; c < n; c++) { const w = wOf(r * n + c - 1, r * n + c); ln += `M${at(c) - w / 2} ${at(r)}h${w}v${s}h${-w}z`; }
  for (let r = 1; r < n; r++) for (let c = 0; c < n; c++) { const w = wOf((r - 1) * n + c, r * n + c); ln += `M${at(c)} ${at(r) - w / 2}h${s}v${w}h${-s}z`; }
  for (let r = 1; r < n; r++) for (let c = 1; c < n; c++) {
    const m = Math.max(wOf((r - 1) * n + c - 1, r * n + c - 1), wOf((r - 1) * n + c, r * n + c), wOf((r - 1) * n + c - 1, (r - 1) * n + c), wOf(r * n + c - 1, r * n + c));
    ln += `M${at(c) - m / 2} ${at(r) - m / 2}h${m}v${m}h${-m}z`;
  }
  if (ln) h += `<path d="${ln}" style="fill:var(--ink)"/>`;
  for (let i = 0; i < n * n; i++) {
    const x = at(i % n), y = at((i / n) | 0), bad = has(o.bad, i);
    if (has(o.why, i)) h += `<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="url(#p-why)"/>`;
    if (bad) h += `<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="url(#p-bad)"/>`;
    if (bad || has(o.hint, i)) h += `<rect x="${x + 1}" y="${y + 1}" width="${s - 2}" height="${s - 2}" fill="none" stroke="#fff" stroke-width="2"/>`;
    if (has(o.q, i)) h += `<path d="${CROWN_D}" transform="translate(${x + s * 0.205} ${y + s * 0.205}) scale(${(s * 0.59) / 24})" fill="${bad ? '#1a0c0c' : o.done ? 'var(--gold)' : '#f6f3ea'}"/>`;
    else if (has(o.x, i)) h += `<path d="M${x + 9} ${y + 9}l6 6m0-6l-6 6" stroke="rgba(255,255,255,.6)" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  return h + '</svg>';
}

function rulesHtml() {
  // Exempelbräde 5 x 5 med fem områden. Lösningen är rad för rad kolumn 1, 3, 0, 2, 4.
  const G = [0, 0, 1, 1, 1, 0, 0, 1, 1, 1, 2, 0, 0, 3, 1, 2, 2, 3, 3, 4, 2, 2, 3, 4, 4].map((r) => [0, 5, 3, 6, 1][r]);
  const B = (o) => mini(Object.assign({ n: 5, grid: G }, o));
  const at = (r, c) => r * 5 + c;
  // Rutor som en dam på (1, 3) blockerar: samma rad, kolumn, område och grannar.
  const q0 = at(1, 3), blocked = [];
  for (let i = 0; i < 25; i++) {
    const r = (i / 5) | 0, c = i % 5;
    if (i !== q0 && (r === 1 || c === 3 || G[i] === G[q0] || (Math.abs(r - 1) <= 1 && Math.abs(c - 3) <= 1))) blocked.push(i);
  }
  const one = (m) => mini(Object.assign({ n: 1, grid: [5] }, m));
  const card = (num, title, text, pic, extra) => `<section class="rule"><div class="pic">${pic}</div><div><h3><span class="n">${num}</span>${title}</h3><p>${text}</p>${extra || ''}</div></section>`;
  const bad = '<span class="verdict bad">Fel</span>', good = '<span class="verdict good">Rätt</span>';
  return [
    card('01', 'Målet', 'Placera en dam i varje rad, varje kolumn och varje färgområde. Ett bräde med fem rader har alltså fem damer.',
      B({ q: [at(0, 1), at(1, 3), at(2, 0), at(3, 2), at(4, 4)], done: true, label: 'Ett löst bräde' }), good),
    card('02', 'En per rad och kolumn', 'Två damer får aldrig stå i samma rad, och aldrig i samma kolumn.',
      B({ q: [at(0, 1), at(0, 4)], bad: [at(0, 1), at(0, 4)], label: 'Två damer i samma rad' }), bad),
    card('03', 'En per färgområde', 'Varje färgat område ska ha exakt en dam, oavsett hur stort det är.',
      B({ q: [at(1, 0), at(2, 2)], bad: [at(1, 0), at(2, 2)], label: 'Två damer i samma område' }), bad),
    card('04', 'Damer får inte röra varandra', 'Inte heller snett. De åtta rutorna runt en dam ska alltid vara tomma.',
      B({ q: [at(3, 2), at(4, 3)], bad: [at(3, 2), at(4, 3)], label: 'Två damer som rör varandra diagonalt' }), bad),
    `<section class="rule col"><div><h3><span class="n">05</span>Så markerar du</h3><p>Tryck på en ruta för att växla mellan kryss, dam och tom. Dra fingret över flera rutor för att kryssa dem på en gång, åt vilket håll som helst. Börjar du dra på ett kryss suddas kryssen i stället.</p></div>
      <div class="taps"><div>${one({ x: [0] })}1 tryck<br>kryss</div><div>${one({ q: [0] })}2 tryck<br>dam</div><div>${one({})}3 tryck<br>tom</div></div></section>`,
    card('06', 'Kryssa det som inte går', 'Sätt kryss där en dam inte kan stå. Varje dam stänger sin rad, kolumn, sitt område och rutorna runt sig.',
      B({ q: [q0], x: blocked, label: 'En dam och alla rutor den stänger, kryssade' })),
    card('07', 'Fastnat? Tryck på Tips', 'Tips visar nästa logiska steg. Ränderna visar varför, den vita ramen visar rutan du ska ändra.',
      B({ q: [at(0, 1), at(1, 3), at(2, 0), at(3, 2)], x: [at(3, 4), at(4, 3)], why: [at(3, 4), at(4, 3), at(4, 4)], hint: [at(4, 4)], label: 'Tips: det sista området har bara en ruta kvar' })),
  ].join('');
}

}, 1000);

load(idx);

// Startskärm. Spela fortsätter på aktuell bana; första gången (inget klarat, regler aldrig visade) öppnas reglerna först.
const start = $('start');
function closeStart(then) {
  start.classList.add('out'); start.setAttribute('aria-hidden', 'true');
  setTimeout(() => { start.hidden = true; }, 260);
  if (then) then();
}
(function initStart() {
  const done = Object.keys(solvedMap).length;
  $('progress').textContent = done ? `${done} av ${LEVELS.length} klara` : '';
  $('startLevel').textContent = (done ? 'Fortsätt på bana ' : 'Bana ') + lv.id;
  $('startPlay').onclick = () => closeStart(() => { if (!store.get('queens.rulesSeen', false) && !done) openRules(); });
  $('startPick').onclick = () => closeStart(openPicker);
  $('startRules').onclick = () => closeStart(openRules);
  $('startPlay').focus({ preventScroll: true });
})();

// Offline-stöd. Service workers kräver http(s), så när filen öppnas direkt från disk hoppas det över.
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
